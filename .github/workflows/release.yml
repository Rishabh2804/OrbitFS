name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle') }}
          path: ~/.gradle
      - name: Build
        run: ./gradlew clean jar --no-daemon
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp build/libs/orbitfs-*.jar dist/orbit-macos-arm64.jar
          else
            cp build/libs/orbitfs-*.jar dist/orbit-macos-x86_64.jar
          fi
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/orbit-macos-*.jar \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "OrbitFS CLI release" \
            --repo "${GITHUB_REPOSITORY}"