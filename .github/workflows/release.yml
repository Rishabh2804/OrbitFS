name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle') }}
          path: ~/.gradle
      - name: Build
        run: ./gradlew clean jar --no-daemon
      - name: Move artifact
        run: |
          mkdir -p dist
          cp build/libs/orbitfs-*.jar dist/orbit.jar
          tar -czvf dist/orbitfs-${{ github.ref_name }}-macos.tar.gz -C dist orbit.jar
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/orbitfs-${{ github.ref_name }}-macos.tar.gz
          tag_name: ${{ github.ref_name }}